posts:[
{id:'b1',title:'7 Strategi Share-to-Share yang Membuat Produk Digital Laris Tanpa Iklan',slug:'strategi-share-to-share',labels:['Growth','Marketing'],emoji:'🚀',ha:0,hb:1,excerpt:'Bagaimana mengubah setiap pengunjung menjadi distributor — mekanisme referral yang bekerja tanpa biaya iklan.',published_at:ago(1),author:'Agus Digital',content:'<h2>Kenapa Share-to-Share?</h2><p>Biaya iklan naik setiap tahun, tapi <strong>rekomendasi teman</strong> tetap menjadi kanal paling dipercaya. Share-to-share mengubah pembeli menjadi promotor secara sukarela.</p><h2>1. Beri insentif yang jelas</h2><p>Bonus digital adalah insentif terbaik: biayanya nol untuk digandakan, nilainya terasa nyata. Pastikan bonus relevan dengan produk utama.</p><h2>2. Buat link unik per orang</h2><p>Setiap pengunjung mendapat kode referral sendiri. Rasa kepemilikan meningkatkan kemungkinan dibagikan hingga 4x.</p><ul><li>Link pendek dan mudah disalin</li><li>Caption siap pakai untuk setiap platform</li><li>Konfirmasi share satu klik</li></ul><h2>3. Follow-up otomatis</h2><p>Setelah orang mendaftar, kirim pesan selamat datang berisi bonus. Ini membangun kebiasaan membuka pesan dari brand kamu.</p><blockquote>Pertumbuhan terbaik bukan dari traffic yang dibeli, tapi dari kepercayaan yang dibagikan.</blockquote><h2>4. Ukur, lalu gandakan</h2><p>Pantau sumber lead, tingkat share, dan konversi. Gandakan mekanisme yang bekerja, buang yang tidak.</p>'},

create or replace function public.verify_lead(contact text) returns boolean language plpgsql security definer set search_path=public as $$
declare w text; begin w:=regexp_replace(coalesce(contact,''),'\\D','','g'); if left(w,1)='0' then w:='62'||substring(w from 2); end if;

function Article(){const{db,article,setArticle,setView,shareItem,opted,open}=useApp();const p=article;return(<section className="max-w-4xl mx-auto px-4 py-10"><button onClick={()=>{setView('blog');setArticle(null);location.hash=''}} className="btn-g px-4 py-2 text-xs mb-5"><i className="fa-solid fa-arrow-left mr-2"/>Kembali ke Blog</button><article className="glass rounded-[28px] overflow-hidden" data-reveal><Cover p={p} className="w-full aspect-[21/9] object-cover"/><div className="p-6 md:p-10"><div className="flex flex-wrap gap-2 mb-4">{(p.labels||[]).map(l=><span key={l} className="tag">#{l}</span>)}</div><h1 className="font-display text-3xl md:text-4xl font-extrabold leading-tight mb-4">{p.title}</h1><div className="text-xs text-slate-500 mb-5"><i className="fa-regular fa-calendar mr-1"/>{fdate(p.published_at)} · {p.author||db.creator.name}</div><div className="flex flex-wrap gap-2 mb-6 pb-5 border-b border-white/5">{[['wa','fa-whatsapp','WhatsApp','text-emerald-400'],['telegram','fa-telegram','Telegram','text-sky-400'],['facebook','fa-facebook','Facebook','text-blue-400'],['copy','fa-link','Salin Link','text-indigo-300'],['caption','fa-copy','Caption','text-cyan-300']].map(([pl,ic,lb,cl])=><button key={pl} onClick={()=>shareItem(p,'blog',pl)} className="btn-g px-4 py-2 text-xs"><i className={`fa-brands ${ic} mr-1.5 ${cl}`}/>{lb}</button>)}</div><div className="article" dangerouslySetInnerHTML={{__html:sanitize(p.content)}}/><div className="mt-10 gsoft rounded-2xl p-6"><h4 className="text-sm font-extrabold mb-2"><i className="fa-solid fa-paper-plane text-emerald-400 mr-2"/>Kirim artikel seperti ini otomatis ke Email & WhatsApp kamu</h4><p className="text-[11px] text-slate-400 mb-3">Setiap artikel dan produk baru langsung terkirim lengkap tanpa perlu cek website lagi.</p>{opted?<div className="text-[11px] text-emerald-300 font-bold"><i className="fa-solid fa-circle-check mr-1"/>Kamu sudah terdaftar di daftar kirim otomatis.</div>:<button onClick={()=>open('lead') tton>)}</div>

function LeadsTab(){const{ltab,setLtab}=useApp();const tabs=[['data','Database Kontak','fa-table'],['kirim','Kirim Broadcast','fa-paper-plane'],['auto','Otomatisasi','fa-robot'],['settings','Pengaturan','fa-sliders'],['log','Log Pengiriman','fa-clipboard-list']];return(<div className="space-y-5"><div className="flex gap-2 flex-wrap">{tabs.map(([k,l,i])=><button key={k} onClick={()=>setLtab(k)} className={'tab '+(ltab===k?'on on-em':'gsoft')}><i className={'fa-solid '+i+' mr-1.5'}/>{l}</button>)}</div>{ltab==='data'&&<LeadsData/>}{ltab==='kirim'&&<Compose/>}{ltab==='auto'&&<Automation/>}{ltab==='settings'&&<SettingsTab/>}{ltab==='log'&&<LogsTab/>}</div>)}
function SortTh({k,label}){const{lsort,setLsort}=useApp();const on=lsort.k===k;return(<th className="cursor-pointer select-none" onClick={()=>setLsort(s=>({k,d:s.k===k?-s.d:-1}))}>{label} <i className={'fa-solid '+(on?(lsort.d===1?'fa-arrow-up':'fa-arrow-down'):'fa-sort')+' text-[8px] ml-1 '+(on?'text-cyan-300':'text-slate-600')}/></th>)}
function LeadsData(){const{fLeads,paged,lq,setLq,lsrc,setLsrc,lst,setLst,ltag,setLtag,lpage,setLpage,sources,sel,setSel,open,delLeads,runBroadcast,importFile,exportLeads,templateXlsx,views,setViews}=useApp();const allChecked=paged.length>0&&paged.every(s=>sel.includes(s.id));return(<div className="space-y-4"><div className="glass p-5 rounded-2xl space-y-3"><div className="flex flex-wrap items-center gap-2"><div className="relative flex-1 min-w-[180px]"><i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-500 text-xs"/><input value={lq} onChange={e=>setLq(e.target.value)} placeholder="Cari nama, email, atau WA…" className="inp pl-9"/></div><select value={lsrc} onChange={e=>setLsrc(e.target.value)} className="inp w-auto"><option>Semua</option>{sources.filter(s=>s!=='Semua').map(s=><option key={s}>{s}</option>)}</select><select value={lst} onChange={e=>setLst(e.target.value)} className="inp w-auto"><option>Semua</option><option value="aktif">aktif</option><option value="nonaktif">nonaktif</option></select><input value={ltag} onChange={e=>setLtag(e.target.value)} placeholder="Filter tag…" className="inp w-auto"/></div><div className="flex flex-wrap gap-2 items-center"><label className="btn-s px-4 py-2.5 text-xs cursor-pointer"><i className="fa-solid fa-file-excel mr-1"/>Import Excel/CSV<input type="file" accept=".xlsx,.xls,.csv,.txt" className="hidden" onChange={e=>importFile(e.target.files?.[0])}/></label><button onClick={exportLeads} className="btn-g px-4 py-2.5 text-xs"><i className="fa-solid fa-download mr-1"/>Export</button><button onClick={templateXlsx} className="btn-g px-4 py-2.5 text-xs"><i className="fa-solid fa-table mr-1"/>Template</button><button onClick={()=>open('editLead',{name:'',email:'',wa:'',source:'manual',tags:'',status:'aktif',notes:''})} className="btn-p px-4 py-2.5 text-xs"><i className="fa-solid fa-plus mr-1"/>Manual</button><button onClick={()=>open('saveView')} className="btn-g px-4 py-2.5 text-xs"><i className="fa-solid fa-bookmark mr-1"/>Simpan View</button>{sel.length>0&&<><button onClick={()=>runBroadcast({ids:sel,campaign:'Kirim Terpilih'})} className="btn-s px-4 py-2.5 text-xs"><i className="fa-solid fa-paper-plane mr-1"/>Kirim ({sel.length})</button><button onClick={()=>delLeads(sel)} className="btn-d px-4 py-2.5 text-xs"><i className="fa-solid fa-trash mr-1"/>Hapus ({sel.length})</button></>}</div>{views.length>0&&<div className="flex flex-wrap gap-2 pt-1">{views.map(v=><span key={v.name} className="chip flex items-center gap-1" onClick={()=>{setLq(v.q||'');setLsrc(v.src||'Semua');setLst(v.status||'Semua');setLtag(v.tag||'')}}><i className="fa-solid fa-bookmark text-[8px]"/>{v.name}<button className="ml-1 opacity-60 hover:opacity-100" onClick={e=>{e.stopPropagation();const n=views.filter(x=>x.name!==v.name);setViews(n);LS.set('sts_views',n)}}><i className="fa-solid fa-xmark"/></button></span>)}</div>}</div><div className="tbl-wrap"><table className="tbl"><thead><tr><th><input type="checkbox" className="accent-emerald-500" checked={allChecked} onChange={e=>setSel(e.target.checked?paged.map(s=>s.id):[])}/></th><SortTh k="name" label="Nama"/><th>Email</th><th>WhatsApp</th><th>Sumber</th><th>Tag</th><th>Status</th><SortTh k="created_at" label="Terdaftar"/><th>Aksi</th></tr></thead><tbody>{paged.map(s=><tr key={s.id} className="cursor-pointer" onClick={()=>open('drawer',s)}><td onClick={e=>e.stopPropagation()}><input type="checkbox" className="accent-emerald-500" checked={sel.includes(s.id)} onChange={e=>setSel(p=>e.target.checked?[...p,s.id]:p.filter(x=>x!==s.id))}/></td><td className="font-bold">{s.name||'-'}</td><td>{s.email||<span className="text-slate-600">-</span>}</td><td className="font-mono text-xs">{s.wa||'-'}</td><td><span className="badge bg-indigo">{s.source||'manual'}</span></td><td className="text-[10px] text-slate-400">{s.tags||'-'}</td><td><span className={'badge '+(s.status==='nonaktif'?'bg-rose':'bg-emerald')}>{s.status||'aktif'}</span></td><td className="text-[10px] text-slate-400">{fdate(s.created_at)}</td><td onClick={e=>e.stopPropagation()}><div className="flex gap-1"><button onClick={()=>runBroadcast({targets:[s],channel:s.wa?(s.email?'both':'wa'):'email',campaign:'Kirim Manual'})} className="btn-s px-2.5 py-1.5 rounded-lg text-[10px]" title="Kirim"><i className="fa-solid fa-paper-plane"/></button><button onClick={()=>open('editLead',{...s})} className="btn-g px-2.5 py-1.5 rounded-lg text-[10px]" title="Edit"><i className="fa-solid fa-pen"/></button><button onClick={()=>delLeads([s.id])} className="btn-d px-2.5 py-1.5 rounded-lg text-[10px]" title="Hapus"><i className="fa-solid fa-trash"/></button></div></td></tr>)}{!paged.length&&<tr><td colSpan="9" className="text-center py-8 text-slate-500">Belum ada kontak. Kumpulkan dari form toko/blog atau import Excel.</td></tr>}</tbody></table></div>{fLeads.length>paged.length&&<button onClick={()=>setLpage(p=>p+1)} className="w-full btn-g py-3 text-xs">Muat lebih banyak ({fLeads.length-paged.length} tersisa)</button>}</div>)}

function LeadForm({source,label='Daftar & Ambil Bonus'}){const{submitLead}=useApp();const[f,setF]=useState({name:'',email:'',whatsapp:''});const[busy,setBusy]=useState(false);const[err,setErr]=useState('');const[hp,setHp]=useState('');const born=useRef(Date.now());const submit=async e=>{e.preventDefault();setErr('');if(hp)return;if(Date.now()-born.current<2500)return setErr('Terlalu cepat — tunggu sebentar lalu coba lagi.');if(!f.name.trim())return setErr('Nama wajib diisi.');const em=f.email.trim().toLowerCase(),wa=waNum(f.whatsapp);if(!EMAIL.test(em))return setErr('Format email belum benar.');if(wa.length<9)return setErr('Nomor WhatsApp belum benar.');setBusy(true);const r=await submitLead({name:f.name.trim(),email:em,whatsapp:wa},source);if(!r.ok)setErr(r.reason);setBusy(false)};return(<form onSubmit={submit} className="space-y-2"><input value={hp} onChange={e=>setHp(e.target.value)} tabIndex="-1" autoComplete="off" aria-hidden="true" style={{position:'absolute',left:'-9999px',opacity:0,height:0}}/><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Nama lengkap" className="inp"/><input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="Email aktif" className="inp"/><input value={f.whatsapp} onChange={e=>setF({...f,whatsapp:e.target.value})} placeholder="Nomor WhatsApp (08xx)" className="inp"/>{err&&<div className="text-[10px] text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-lg px-2.5 py-2"><i className="fa-solid fa-circle-exclamation mr-1"/>{err}</div>}<button disabled={busy} className="w-full btn-p py-3 text-xs">{busy?<><i className="fa-solid fa-spinner fa-spin mr-2"/>Menyimpan…</>:<><i className="fa-solid fa-paper-plane mr-2"/>{label}</>}</button><p className="text-[9px] text-slate-500 leading-relaxed pt-1">Dengan mendaftar, kamu menyetujui menerima info produk & promo via email/WhatsApp. Berhenti kapan saja dengan balas STOP.</p></form>)}

function LinkEditor(){const{modal,close,saveLink}=useApp();const[f,setF]=useState(modal.d);return(<Modal title={f.id?'Edit Link':'Tambah Link'} sub="Link Cepat" onClose={close}><form onSubmit={e=>{e.preventDefault();saveLink(f)}} className="space-y-3"><Field l="Judul"><input required value={f.title} onChange={e=>setF({...f,title:e.target.value})} className="inp"/></Field><Field l="URL Tujuan"><input type="url" required value={f.url} onChange={e=>setF({...f,url:e.target.value})} className="inp"/></Field><Field l="Ikon (Font Awesome)"><select value={f.icon||'fa-solid fa-link'} onChange={e=>setF({...f,icon:e.target.value})} className="inp">{['fa-solid fa-link','fa-brands fa-whatsapp','fa-brands fa-instagram','fa-brands fa-telegram','fa-brands fa-tiktok','fa-brands fa-youtube','fa-solid fa-folder-open','fa-solid fa-cart-shopping','fa-solid fa-globe'].map(i=><option key={i} value={i}>{i}</option>)}</select></Field><div className="flex gap-2 pt-2"><button type="button" onClick={close} className="flex-1 btn-g py-3 text-xs">Batal</button><button type="submit" className="flex-[2] btn-p py-3 text-xs">Simpan Link</button></div></form></Modal>)}
function LeadEditor(){const{modal,close,saveLead,updateLead,toast}=useApp();const[f,setF]=useState(modal.d);const set=(k,v)=>setF(x=>({...x,[k]:v}));const submit=async e=>{e.preventDefault();if(f.id){updateLead(f);toast('✅ Kontak diperbarui.')}else{const r=await saveLead({...f,whatsapp:f.wa});if(!r.ok)return toast('❌ '+r.reason);toast(r.dup?'✅ Kontak sudah ada — diperbarui.':'✅ Kontak ditambahkan.')}close()};return(<Modal title={f.id?'Edit Kontak':'Tambah Kontak Manual'} sub="Database Leads" onClose={close}><form onSubmit={submit} className="space-y-3"><Field l="Nama"><input value={f.name||''} onChange={e=>set('name',e.target.value)} className="inp"/></Field><Field l="Email"><input value={f.email||''} onChange={e=>set('email',e.target.value)} className="inp"/></Field><Field l="WhatsApp"><input value={f.wa||''} onChange={e=>set('wa',e.target.value)} placeholder="08xx / 62xx" className="inp"/></Field><div className="grid grid-cols-2 gap-3"><Field l="Sumber"><input value={f.source||''} onChange={e=>set('source',e.target.value)} className="inp"/></Field><Field l="Status"><select value={f.status||'aktif'} onChange={e=>set('status',e.target.value)} className="inp"><option value="aktif">aktif</option><option value="nonaktif">nonaktif</option></select></Field></div><Field l="Tag"><input value={f.tags||''} onChange={e=>set('tags',e.target.value)} placeholder="pelanggan, reseller" className="inp"/></Field><Field l="Catatan"><textarea rows="2" value={f.notes||''} onChange={e=>set('notes',e.target.value)} className="inp"/></Field><div className="flex gap-2 pt-2"><button type="button" onClick={close} className="flex-1 btn-g py-3 text-xs">Batal</button><button type="submit" className="flex-[2] btn-p py-3 text-xs">Simpan Kontak</button></div></form></Modal>)}
function LeadDrawer(){const{modal,close,updateLead,delLeads,runBroadcast,open}=useApp();const s=modal.d;return(<><div className="fixed inset-0 z-[84] bg-black/50" onClick={close}/><div className="drawer"><div className="p-6 space-y-5"><div className="flex items-start justify-between"><div className="flex items-center gap-3"><div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center font-extrabold text-white">{(s.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('')}</div><div><h3 className="font-display font-extrabold">{s.name}</h3><span className={'badge '+(s.status==='nonaktif'?'bg-rose':'bg-emerald')}>{s.status||'aktif'}</span></div></div><button onClick={close} className="btn-g w-9 h-9 rounded-xl"><i className="fa-solid fa-xmark"/></button></div><div className="space-y-2 text-xs"><div className="gsoft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-envelope text-cyan-300 w-4"/><span className="flex-1 truncate">{s.email||'-'}</span><button onClick={()=>copy(s.email)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-copy"/></button></div><div className="gsoft rounded-xl p-3 flex items-center gap-3"><i className="fa-brands fa-whatsapp text-emerald-300 w-4"/><span className="flex-1 font-mono">{s.wa||'-'}</span><button onClick={()=>copy(s.wa)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-copy"/></button></div><div className="gsoft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-tag text-indigo-300 w-4"/><span className="flex-1">{s.tags||'-'}</span></div><div className="gsoft rounded-xl p-3 flex items-center gap-3"><i className="fa-solid fa-arrow-right-to-bracket text-fuchsia-300 w-4"/><span className="flex-1">{s.source||'manual'} · {fdt(s.created_at)}</span></div></div><div><label className="lbl">Catatan</label><textarea rows="3" defaultValue={s.notes||''} onBlur={e=>updateLead({...s,notes:e.target.value})} className="inp" placeholder="Tambah catatan…"/></div><div className="gdark rounded-xl p-3 text-[11px]"><div className="text-slate-500 text-[9px] uppercase font-bold mb-1">Kampanye Terakhir</div>{s.last_campaign?<span>{s.last_campaign} · <b className={s.last_status==='terkirim'?'text-emerald-300':'text-rose-300'}>{s.last_status}</b> · {fdt(s.last_sent_at)}</span>:<span className="text-slate-500">Belum pernah dikirim</span>}</div><div className="grid grid-cols-2 gap-2"><button onClick={()=>runBroadcast({targets:[s],channel:s.wa?'wa':'email',campaign:'Kirim Manual'})} className="btn-p py-3 text-xs"><i className="fa-solid fa-paper-plane mr-1"/>Kirim Pesan</button><button onClick={()=>open('editLead',{...s})} className="btn-g py-3 text-xs"><i className="fa-solid fa-pen mr-1"/>Edit</button><button onClick={()=>{updateLead({...s,status:s.status==='nonaktif'?'aktif':'nonaktif'})}} className="btn-g py-3 text-xs"><i className="fa-solid fa-toggle-on mr-1"/>{s.status==='nonaktif'?'Aktifkan':'Nonaktifkan'}</button><button onClick={()=>{delLeads([s.id]);close()}} className="btn-d py-3 text-xs"><i className="fa-solid fa-trash mr-1"/>Hapus</button></div></div></div></>)}
function ImportModal(){const{imp,setImp,confirmImport,close}=useApp();return(<Modal title="Import Data dari Excel / CSV" sub={imp.file+' · '+imp.rows.length+' baris'} onClose={close} w="max-w-3xl"><div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">{['name','email','wa','tags','source'].map(f=><Field key={f} l={f==='wa'?'whatsapp':f}><select value={imp.map[f]} onChange={e=>setImp({...imp,map:{...imp.map,[f]:e.target.value}})} className="inp text-xs"><option value="">— kosong —</option>{imp.cols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>)}</div><div className="tbl-wrap max-h-64 mb-4"><table className="tbl"><thead><tr>{imp.cols.map(c=><th key={c}>{c}</th>)}</tr></thead><tbody>{imp.preview.map((r,i)=><tr key={i}>{imp.cols.map(c=><td key={c}>{String(r[c]??'')}</td>)}</tr>)}</tbody></table></div><div className="flex gap-2"><button disabled={imp.busy} onClick={confirmImport} className="flex-1 btn-p py-3 text-xs"><i className={'fa-solid '+(imp.busy?'fa-spinner fa-spin':'fa-file-import')+' mr-2'}/>{imp.busy?'Mengimpor…':`Import ${imp.rows.length} Data`}</button><button onClick={close} className="btn-g px-5 py-3 text-xs">Batal</button></div></Modal>)}
function SaveViewModal(){const{close,lq,lsrc,lst,ltag,views,setViews,toast}=useApp();const[name,setName]=useState('');return(<Modal title="Simpan Tampilan Filter" sub="Saved View" onClose={close}><form onSubmit={e=>{e.preventDefault();if(!name.trim())return;const n=[...views.filter(v=>v.name!==name.trim()),{name:name.trim(),q:lq,src:lsrc,status:lst,tag:ltag}];setViews(n);LS.set('sts_views',n);toast('✅ View "'+name.trim()+'" disimpan.');close()}} className="space-y-3"><Field l="Nama View"><input value={name} onChange={e=>setName(e.target.value)} placeholder="Pelanggan aktif bulan ini" className="inp" autoFocus/></Field><div className="gdark rounded-xl p-3 text-[10px] text-slate-400">Filter saat ini: {lq||'tanpa pencarian'} · {lsrc} · {lst} · {ltag||'semua tag'}</div><button className="w-full btn-p py-3 text-xs">Simpan View</button></form></Modal>)}
function Palette({onClose}){const{actions}=useApp();const[q,setQ]=useState('');const[idx,setIdx]=useState(0);const list=actions.filter(a=>a.l.toLowerCase().includes(q.toLowerCase()));useEffect(()=>setIdx(0),[q]);const run=a=>{onClose();setTimeout(a.f,60)};return(<div className="overlay" style={{alignItems:'flex-start',paddingTop:'12vh'}} onClick={onClose}><div className="cmdk" onClick={e=>e.stopPropagation()}><div className="flex items-center gap-3 px-4 py-3 border-b border-white/10"><i className="fa-solid fa-terminal text-cyan-300 text-sm"/><input autoFocus value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='ArrowDown'){e.preventDefault();setIdx(i=>Math.min(i+1,list.length-1))}if(e.key==='ArrowUp'){e.preventDefault();setIdx(i=>Math.max(i-1,0))}if(e.key==='Enter'&&list[idx])run(list[idx]);if(e.key==='Escape')onClose()}} placeholder="Ketik perintah… (leads, broadcast, produk baru, export…)" className="flex-1 bg-transparent outline-none text-sm text-white placeholder:text-slate-500"/><span className="kbd">ESC</span></div><div className="overflow-y-auto py-2">{list.map((a,i)=><div key={a.l} className={'cmdk-item '+(i===idx?'on':'')} onMouseEnter={()=>setIdx(i)} onClick={()=>run(a)}><i className={'fa-solid '+a.i+' text-indigo-300 w-5 text-center'}/><span className="flex-1">{a.l}</span>{a.h&&<span className="kbd">{a.h}</span>}</div>)}{!list.length&&<div className="px-4 py-6 text-center text-xs text-slate-500">Tidak ada perintah cocok.</div>}</div></div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
